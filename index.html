<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2540">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Вода">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" id="appleIcon">
<title>Вода</title>
<style>
:root{
  --glass: rgba(255,255,255,.14);
  --stroke: rgba(255,255,255,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  color:#fff;background:#0b2540;overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
body::before{
  content:"";position:fixed;inset:-20%;z-index:-1;
  background:
    radial-gradient(circle at 20% 20%,#38bdf8 0,transparent 40%),
    radial-gradient(circle at 80% 30%,#818cf8 0,transparent 40%),
    radial-gradient(circle at 50% 90%,#22d3ee 0,transparent 45%);
  filter:blur(40px);
  transition:filter 1.5s ease;
  animation:drift 18s ease-in-out infinite alternate;
}
body.done::before{filter:blur(40px) hue-rotate(80deg) saturate(1.6)}
@keyframes drift{to{transform:translate(4%,-3%) scale(1.08)}}

.app{
  height:100dvh;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px;
  padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 20px);
}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:30px;font-weight:700;letter-spacing:-.5px}

.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--stroke);
  border-radius:30px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 40px rgba(0,0,0,.18);
}
.icon-btn{
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  color:#fff;font-size:20px;background:var(--glass);border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  transition:transform .2s;
}
.icon-btn:active{transform:scale(.9)}

.bottle{flex:1;position:relative;overflow:hidden;min-height:260px;transition:transform .3s}
.bottle.pulse{animation:pulse .45s ease}
@keyframes pulse{50%{transform:scale(1.02)}}
.water{
  position:absolute;left:0;right:0;bottom:0;height:0;
  background:linear-gradient(180deg,rgba(125,211,252,.85),rgba(14,165,233,.92));
  transition:height 1s cubic-bezier(.3,1.3,.6,1), filter 1.5s ease;
}
.done .water{filter:hue-rotate(110deg) saturate(1.3)}
.wave{position:absolute;top:-22px;left:0;width:200%;height:24px;animation:wave 2.6s linear infinite}
.wave svg{width:100%;height:100%;display:block;fill:rgba(125,211,252,.85)}
@keyframes wave{to{transform:translateX(-50%)}}
.stats{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
}
.percent{font-size:72px;font-weight:700;letter-spacing:-3px;text-shadow:0 2px 20px rgba(0,0,0,.2)}
.total{font-size:18px;font-weight:600;opacity:.95}
.remain{font-size:15px;opacity:.8;margin-top:6px}

.controls{display:flex;flex-direction:column;gap:16px;padding:18px}

/* барабан (как выбор времени в iOS) */
.wheel-wrap{
  position:relative;height:180px;overflow:hidden;
  -webkit-mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);
          mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);
}
.wheel{
  height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;
  padding:70px 0;overscroll-behavior:contain;
}
.wheel::-webkit-scrollbar{display:none}
.wheel div{
  height:40px;line-height:40px;text-align:center;scroll-snap-align:center;
  font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;
  opacity:.35;transform:scale(.9);transition:opacity .15s,transform .15s;
}
.wheel-band{
  position:absolute;left:12px;right:12px;top:50%;height:40px;transform:translateY(-50%);
  border-radius:14px;background:rgba(255,255,255,.18);border:1px solid var(--stroke);
  pointer-events:none;
}
.unit{
  position:absolute;right:30px;top:50%;transform:translateY(-50%);
  font-size:16px;font-weight:600;opacity:.85;pointer-events:none;z-index:2;
}

.slider{
  position:relative;height:68px;border-radius:34px;overflow:hidden;
  background:rgba(255,255,255,.18);border:1px solid var(--stroke);
  touch-action:none;user-select:none;-webkit-user-select:none;
}
.slider .label{
  position:absolute;inset:0;display:grid;place-items:center;padding-left:40px;
  font-weight:600;font-size:16px;pointer-events:none;opacity:.92;
}
.fill{
  position:absolute;left:0;top:0;bottom:0;width:0;border-radius:34px;
  background:linear-gradient(90deg,rgba(255,255,255,.15),rgba(255,255,255,.5));
}
.knob{
  position:absolute;top:4px;left:4px;width:60px;height:60px;border-radius:50%;
  background:#fff;color:#0284c7;display:grid;place-items:center;font-size:26px;font-weight:700;
  box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:2;
  transition:transform .35s cubic-bezier(.3,1.3,.5,1);
}
.knob.dragging{transition:none}

.overlay{
  position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.25);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;transition:opacity .4s;
}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:12px;right:12px;bottom:12px;max-width:436px;margin:0 auto;padding:26px;
  transform:translateY(120%);transition:transform .55s cubic-bezier(.2,.9,.3,1.1);
  background:rgba(20,40,70,.45);
}
.overlay.open .sheet{transform:none}
.sheet h2{font-size:22px;margin-bottom:6px}
.sheet p{opacity:.75;font-size:14px;margin-bottom:16px}
input{
  width:100%;padding:15px;border-radius:16px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.15);color:#fff;font-size:18px;outline:none;
}
.btn{
  width:100%;padding:16px;border-radius:18px;border:none;cursor:pointer;
  font-weight:700;font-size:17px;margin-top:12px;
}
.btn.primary{background:#fff;color:#0369a1}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid var(--stroke)}

.toast{
  position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:50%;z-index:20;
  padding:14px 22px;border-radius:22px;font-weight:600;white-space:nowrap;
  transform:translate(-50%,-180%);transition:transform .5s cubic-bezier(.2,.9,.3,1.2);
}
.toast.show{transform:translate(-50%,0)}

.spark{
  position:fixed;left:50%;top:45%;width:10px;height:10px;border-radius:50%;
  pointer-events:none;z-index:15;animation:burst 1.4s ease-out forwards;
}
@keyframes burst{
  to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Вода</h1>
    <button class="icon-btn" id="openSettings" aria-label="Настройки">⚙︎</button>
  </header>

  <div class="glass bottle" id="bottle">
    <div class="water" id="water">
      <div class="wave"><svg viewBox="0 0 1200 60" preserveAspectRatio="none"><path d="M0 30 Q37.5 0 75 30 T150 30 T225 30 T300 30 T375 30 T450 30 T525 30 T600 30 T675 30 T750 30 T825 30 T900 30 T975 30 T1050 30 T1125 30 T1200 30 V60 H0Z"/></svg></div>
    </div>
    <div class="stats">
      <div class="percent" id="percent">0%</div>
      <div class="total" id="total">0 / 2000 мл</div>
      <div class="remain" id="remain"></div>
    </div>
  </div>

  <div class="glass controls">
    <div class="wheel-wrap">
      <div class="wheel-band"></div>
      <div class="wheel" id="wheel"></div>
      <span class="unit">мл</span>
    </div>

    <div class="slider" id="slider">
      <div class="fill" id="fill"></div>
      <div class="knob" id="knob">→</div>
      <div class="label" id="sliderLabel">Свайпни, чтобы добавить</div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="glass sheet">
    <h2>Настройки</h2>
    <p>Дневная норма воды в миллилитрах</p>
    <input type="number" id="goalInput" inputmode="numeric" min="500" max="6000" step="50">
    <button class="btn primary" id="saveGoal">Сохранить</button>
    <button class="btn ghost" id="resetToday">Сбросить сегодня</button>
  </div>
</div>

<div class="toast glass" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const KEY = 'water-tracker-v1';
const DROP = 'M256 80 C256 80 150 220 150 312 A106 106 0 0 0 362 312 C362 220 256 80 256 80Z';
const ITEM_H = 40;
const VALUES = Array.from({ length: 100 }, (_, i) => (i + 1) * 10); // 10..1000 мл

let state = load();

function load(){
  let s = {};
  try { s = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
  const today = new Date().toDateString();
  const sameDay = s.date === today;
  return {
    goal: s.goal || 2000,
    total: sameDay ? (s.total || 0) : 0,
    date: today,
    celebrated: sameDay ? !!s.celebrated : false,
    amount: s.amount || 250
  };
}
function save(){
  localStorage.setItem(KEY, JSON.stringify({
    goal: state.goal, total: state.total, date: state.date,
    celebrated: state.celebrated, amount: state.amount
  }));
}

/* ----- барабан ----- */
const wheel = $('#wheel');
VALUES.forEach(v => {
  const d = document.createElement('div');
  d.textContent = v;
  wheel.appendChild(d);
});

function setWheelStyle(){
  const center = wheel.scrollTop / ITEM_H;
  [...wheel.children].forEach((el, i) => {
    const d = Math.abs(i - center);
    el.style.opacity = Math.max(0.25, 1 - d * 0.3);
    el.style.transform = `scale(${Math.max(0.8, 1 - d * 0.06)})`;
  });
}

wheel.addEventListener('scroll', () => {
  const i = Math.min(VALUES.length - 1, Math.max(0, Math.round(wheel.scrollTop / ITEM_H)));
  if (VALUES[i] !== state.amount) {
    state.amount = VALUES[i];
    save();
    $('#sliderLabel').textContent = `Свайпни, чтобы добавить ${state.amount} мл`;
  }
  setWheelStyle();
}, { passive: true });

/* ----- свайп-подтверждение ----- */
const slider = $('#slider'), knob = $('#knob'), fill = $('#fill');
let drag = null;
const maxDx = () => slider.clientWidth - knob.offsetWidth - 8;

slider.addEventListener('pointerdown', e => {
  drag = { x: e.clientX, dx: 0 };
  knob.classList.add('dragging');
  slider.setPointerCapture(e.pointerId);
});
slider.addEventListener('pointermove', e => {
  if (!drag) return;
  drag.dx = Math.max(0, Math.min(e.clientX - drag.x, maxDx()));
  knob.style.transform = `translateX(${drag.dx}px)`;
  fill.style.width = (drag.dx + knob.offsetWidth + 8) + 'px';
});
function endDrag(){
  if (!drag) return;
  const ok = drag.dx > maxDx() * 0.85;
  knob.classList.remove('dragging');
  if (ok) {
    knob.style.transform = `translateX(${maxDx()}px)`;
    fill.style.width = '100%';
    addWater();
    setTimeout(resetSlider, 350);
  } else {
    resetSlider();
  }
  drag = null;
}
function resetSlider(){
  knob.style.transform = 'translateX(0)';
  fill.style.width = '0';
}
slider.addEventListener('pointerup', endDrag);
slider.addEventListener('pointercancel', endDrag);

function addWater(){
  state.total += state.amount;
  save();
  render();
  const b = $('#bottle');
  b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse');
  navigator.vibrate?.(15);
  if (!state.celebrated && state.total >= state.goal) {
    state.celebrated = true;
    save();
    celebrate();
  }
}

function render(){
  const p = Math.min(state.total / state.goal, 1);
  $('#water').style.height = (p * 100).toFixed(1) + '%';
  $('#percent').textContent = Math.round(p * 100) + '%';
  $('#total').textContent = `${state.total} / ${state.goal} мл`;
  $('#remain').textContent = p >= 1 ? 'Цель выполнена 🎉' : `Осталось ${state.goal - state.total} мл`;
  document.body.classList.toggle('done', p >= 1);
  $('#sliderLabel').textContent = `Свайпни, чтобы добавить ${state.amount} мл`;
}

function celebrate(){
  toast('Цель выполнена! Так держать 💧');
  const colors = ['#fde047','#67e8f9','#86efac','#f0abfc','#fff'];
  for (let i = 0; i < 32; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    const a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 160;
    s.style.setProperty('--x', Math.cos(a) * d + 'px');
    s.style.setProperty('--y', Math.sin(a) * d + 'px');
    s.style.background = colors[i % colors.length];
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1500);
  }
}

let toastTimer;
function toast(text){
  const t = $('#toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ----- настройки ----- */
const overlay = $('#overlay');
$('#openSettings').onclick = () => {
  $('#goalInput').value = state.goal;
  overlay.classList.add('open');
};
overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });
$('#saveGoal').onclick = () => {
  const v = parseInt($('#goalInput').value, 10);
  if (!(v >= 500 && v <= 6000)) { toast('Введи норму от 500 до 6000 мл'); return; }
  state.goal = v;
  if (state.total < state.goal) state.celebrated = false;
  save(); render();
  overlay.classList.remove('open');
  toast('Норма сохранена');
};
$('#resetToday').onclick = () => {
  state.total = 0;
  state.celebrated = false;
  save(); render();
  overlay.classList.remove('open');
};

/* иконка для iPhone */
(function makeAppleIcon(){
  const c = document.createElement('canvas');
  c.width = c.height = 180;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 180, 180);
  g.addColorStop(0, '#38bdf8'); g.addColorStop(1, '#1d4ed8');
  x.fillStyle = g; x.fillRect(0, 0, 180, 180);
  x.scale(180 / 512, 180 / 512);
  x.fillStyle = '#fff';
  x.fill(new Path2D(DROP));
  $('#appleIcon').href = c.toDataURL('image/png');
})();

/* стартовая позиция барабана на сохранённом значении */
const startIdx = Math.max(0, VALUES.indexOf(state.amount));
wheel.scrollTop = startIdx * ITEM_H;
setWheelStyle();
render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
